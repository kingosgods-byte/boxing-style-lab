<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><title>Boxing Style Lab</title><style>body{margin:0;background:#0b0b0b;color:#eee;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:760px;margin:auto;padding:18px}.card{background:#171717;border:1px solid #292929;border-radius:16px;padding:16px;margin:12px 0}button,select,input{font:inherit}button{background:#e9e9e9;color:#111;border:0;border-radius:10px;padding:11px 14px;margin:4px 4px 4px 0;font-weight:700}select{background:#222;color:#fff;border:1px solid #444;border-radius:9px;padding:10px;width:100%}.tabs{display:flex;gap:6px;position:sticky;top:0;background:#0b0b0b;padding:8px 0;z-index:2}.tabs button{flex:1;background:#222;color:#ddd}.tabs button.active{background:#eee;color:#111}.score{font-size:30px;font-weight:800}.muted{color:#aaa}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.bar{height:9px;background:#303030;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#eee}.video{width:100%;border-radius:12px;background:#000;max-height:55vh}.hidden{display:none}.error{color:#ff9c9c;white-space:pre-wrap}.ok{color:#a8f0b0}</style></head><body><main><h1>🥊 Boxing Style Lab</h1><div class="muted">Free personal boxing coach • local video analysis</div><div class="tabs"><button data-tab="coach">Coach</button><button data-tab="train">Train</button><button data-tab="timer">Timer</button><button data-tab="progress">Progress</button></div><section id="coach" class="tab"><div class="card"><h2>Style</h2><select id="style"></select><p id="styleInfo" class="muted"></p></div><div class="card"><h2>Video Analysis</h2><input id="videoFile" type="file" accept="video/*"><p class="muted">Pick a short full-body boxing clip. Analysis stays on this device.</p><video id="video" class="video hidden" controls playsinline></video><button id="analyze" class="hidden">Analyze video</button><div id="status"></div><div id="scores"></div></div></section><section id="train" class="tab hidden"><div class="card"><h2>Workout</h2><button id="workoutBtn">Generate workout</button><div id="workout"></div></div></section><section id="timer" class="tab hidden"><div class="card"><h2>Round Timer</h2><div id="clock" class="score">3:00</div><button id="start">Start</button><button id="reset">Reset</button><button id="combo">Call combination</button><h3 id="call"></h3></div></section><section id="progress" class="tab hidden"><div class="card"><h2>Progress</h2><p>Analyses completed: <b id="count">0</b></p><button id="clear">Clear progress</button></div></section></main><script type="module">
import {PoseLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';
const styles={
 Bivol:{name:'Dmitry Bivol',info:'Balanced Eastern European boxing: distance control, disciplined guard, jab variety, clean exits, efficient recovery.',tips:['Stay balanced while punching','Control distance with the jab','Exit laterally without crossing your feet','Recover both hands after every punch']},
 GGG:{name:'Gennady Golovkin',info:'Pressure and control: heavy jab, compact combinations, ring cutting and strong position.',tips:['Keep pressure without rushing','Use the jab to control the opponent','Cut the ring instead of chasing','Finish combinations in a stable stance']},
 Usyk:{name:'Oleksandr Usyk',info:'Mobile southpaw fundamentals: angles, rhythm changes, footwork and punch recovery.'},
 Loma:{name:'Vasiliy Lomachenko',info:'Angle creation, pivots, rhythm changes and combination entries.'},
 Canelo:{name:'Canelo Alvarez',info:'Compact guard, counters, slips, body punching and controlled pressure.'},
 Mayweather:{name:'Floyd Mayweather Jr.',info:'Defensive structure, distance management, counters and efficient exits.'}};
const styleSel=document.querySelector('#style'); for(const [k,v] of Object.entries(styles)){let o=document.createElement('option');o.value=k;o.textContent=v.name;styleSel.append(o)}
function showStyle(){let s=styles[styleSel.value];document.querySelector('#styleInfo').textContent=s.info+(s.tips?' '+s.tips.join(' • '):'')} showStyle();styleSel.onchange=showStyle;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));document.querySelector('#'+b.dataset.tab).classList.remove('hidden');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelector('[data-tab="coach"]').classList.add('active');
let pose=null;
async function getPose(){if(pose)return pose;document.querySelector('#status').textContent='Loading pose model…';const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5});return pose}
const file=document.querySelector('#videoFile'),video=document.querySelector('#video'),analyze=document.querySelector('#analyze'),status=document.querySelector('#status'),scores=document.querySelector('#scores');let objectUrl=null;
file.onchange=()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);const f=file.files?.[0];if(!f)return;objectUrl=URL.createObjectURL(f);video.src=objectUrl;video.classList.remove('hidden');analyze.classList.remove('hidden');status.textContent='Video ready.';scores.innerHTML='';video.currentTime=0};
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(x){return Math.max(0,Math.min(100,Math.round(x)))}
function calc(lms){const ls=lms[11],rs=lms[12],lh=lms[23],rh=lms[24],lw=lms[15],rw=lms[16],nose=lms[0];if(![ls,rs,lh,rh,lw,rw,nose].every(Boolean))return null;const shoulder=d(ls,rs),hip=d(lh,rh),stance=d(lh,rh);const hands=Math.min(d(lw,nose),d(rw,nose));const lean=Math.abs(((ls.x+rs.x)/2)-((lh.x+rh.x)/2));const base=clamp(100-Math.abs(stance/Math.max(.001,shoulder)-1.35)*45);const guard=clamp(100-Math.max(0,hands/Math.max(.001,shoulder)-.85)*85);const balance=clamp(100-lean*240);return {balance,guard,base}}
function renderScores(a){scores.innerHTML=Object.entries(a).map(([k,v])=>`<div class="card"><div class="row"><b>${k[0].toUpperCase()+k.slice(1)}</b><span class="score">${v}</span></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
let runToken=0;
analyze.onclick=async()=>{const token=++runToken;analyze.disabled=true;scores.innerHTML='';status.className='';try{const p=await getPose();if(token!==runToken)return;video.pause();video.currentTime=0;await new Promise((res,rej)=>{if(video.readyState>=2)res();else{video.addEventListener('loadeddata',res,{once:true});video.addEventListener('error',()=>rej(new Error('Could not load the video.')), {once:true})}});const duration=video.duration;if(!Number.isFinite(duration)||duration<=0)throw new Error('The video duration could not be read.');const sampleCount=Math.min(60,Math.max(12,Math.floor(duration*3)));let vals=[],lastTs=-1;for(let i=0;i<sampleCount;i++){if(token!==runToken)throw new Error('Analysis cancelled.');const t=(duration*i)/(sampleCount-1);video.currentTime=Math.min(Math.max(t,0),Math.max(0,duration-.001));await new Promise(res=>{const done=()=>{video.removeEventListener('seeked',done);res()};video.addEventListener('seeked',done,{once:true});});await sleep(10);let ts=Math.max(1,Math.round(video.currentTime*1000));if(ts<=lastTs)ts=lastTs+1;lastTs=ts;const result=p.detectForVideo(video,ts);if(result?.landmarks?.[0]){const s=calc(result.landmarks[0]);if(s)vals.push(s)}status.textContent=`Analyzing ${i+1}/${sampleCount}…`}
if(!vals.length)throw new Error('No full-body pose was detected. Try a brighter clip with your whole body visible.');const avg=k=>clamp(vals.reduce((a,b)=>a+b[k],0)/vals.length);const out={balance:avg('balance'),guard:avg('guard'),base:avg('base')};renderScores(out);status.className='ok';status.textContent=`Analysis complete using ${vals.length} usable frames. Style: ${styles[styleSel.value].name}.`;localStorage.analysisCount=String((+localStorage.analysisCount||0)+1);document.querySelector('#count').textContent=localStorage.analysisCount}catch(e){status.className='error';status.textContent='Analysis failed: '+(e?.message||e);scores.innerHTML='<p class="muted">Try a short, clear full-body video with the camera steady.</p>'}finally{analyze.disabled=false}};
// simple training/timer
const combos=['1-2','1-1-2','1-2-3','1-1-2-3','2-3-2','1-2-slip-2','1-2-3-2'];document.querySelector('#combo').onclick=()=>document.querySelector('#call').textContent=combos[Math.floor(Math.random()*combos.length)];document.querySelector('#workoutBtn').onclick=()=>{const s=styles[styleSel.value];document.querySelector('#workout').innerHTML='<ul><li>3×3 min shadowboxing — '+s.name+' principles</li><li>3×3 min jab/footwork rounds</li><li>3×2 min combination rounds</li><li>3×1 min defensive movement rounds</li></ul>'};let end=0,timer=null;function tick(){let left=Math.max(0,end-Date.now());document.querySelector('#clock').textContent=new Date(left).toISOString().slice(14,19);if(left<=0){clearInterval(timer);timer=null}}document.querySelector('#start').onclick=()=>{if(timer)return;end=Date.now()+180000;tick();timer=setInterval(tick,250)};document.querySelector('#reset').onclick=()=>{clearInterval(timer);timer=null;document.querySelector('#clock').textContent='3:00'};document.querySelector('#count').textContent=localStorage.analysisCount||0;document.querySelector('#clear').onclick=()=>{localStorage.removeItem('analysisCount');document.querySelector('#count').textContent='0'};
</script></body></html>
